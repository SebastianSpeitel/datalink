[workspace]
members = [".", "datalink_derive"]

[package]
name = "datalink"
version = "0.4.2"
edition = "2024"

[features]
default = ["std", "unique", "well_known"]
std = []
foreign = []
unique = []
well_known = []
derive = ["dep:datalink_derive"]
random = ["dep:rand"]
json = ["dep:serde_json", "std"]
toml = ["dep:toml", "std"]
smol_str = ["dep:smol_str"]

[dependencies]
rand = { version = "0.10", optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "1.1", optional = true }
datalink_derive = { path = "datalink_derive", optional = true }
# memchr = "2.8"
smol_str = { version = "0.3", default-features = false, optional = true }

[[example]]
name = "derive"
required-features = ["derive"]

[[example]]
name = "inxi"
required-features = ["json"]

[lints.clippy]
arbitrary_source_item_ordering = "warn"

[profile.release]
# strip = false
# lto = true
opt-level = 3
panic = "abort"
codegen-units = 1

[dev-dependencies]
assert_no_alloc = { version = "1.1", default-features = false, features = [
    # "warn_debug",
] }
